<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexxroute Video Router</title>
  <style>
    :root {
      --bg-top: #f5f1e8;
      --bg-bottom: #e9eef4;
      --panel: #ffffff;
      --ink: #142022;
      --muted: #5f6f75;
      --line: #d5dfe4;
      --active: #0d6cc2;
      --active-soft: #d9ecff;
      --warn: #bf4f00;
      --warn-soft: #ffe8d1;
      --ok: #1e7a43;
      --ok-soft: #daf4e6;
      --cell-dot: #18272b;
      --cell-inactive: #f6f9fb;
      --shadow: 0 12px 38px rgba(20, 32, 34, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Trebuchet MS", "Franklin Gothic Medium", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.85) 0 18%, transparent 19%),
        radial-gradient(circle at 84% 14%, rgba(255, 255, 255, 0.6) 0 14%, transparent 15%),
        linear-gradient(155deg, var(--bg-top), var(--bg-bottom));
      padding: 20px;
    }

    .shell {
      max-width: 1320px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #f7fbff);
    }

    .title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 5px 10px;
      border: 1px solid transparent;
    }

    .badge.live {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: #bde7cf;
    }

    .badge.stale {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: #ffd0a7;
    }

    .refresh-btn {
      border: 1px solid #2a3b41;
      border-radius: 8px;
      background: #23363d;
      color: #f5fcff;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .refresh-btn:hover {
      transform: translateY(-1px);
      background: #16272d;
    }

    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .subbar {
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
      background: #f9fcff;
    }

    .matrix-wrap {
      padding: 14px;
    }

    .matrix-scroller {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: auto;
      max-height: min(72vh, 780px);
      background: #fcfdff;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: #f2f8fd;
      border-bottom: 1px solid var(--line);
    }

    tbody th {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #f7fbff;
      border-right: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      padding: 8px 10px;
      font-size: 0.83rem;
      color: #25393f;
    }

    th.corner {
      z-index: 5;
      left: 0;
      min-width: 108px;
      max-width: 108px;
      background: #eaf3fb;
      border-right: 1px solid var(--line);
      text-align: left;
      font-size: 0.78rem;
      color: #324950;
      padding: 8px 10px;
    }

    th.dest {
      min-width: 48px;
      width: 48px;
      height: 82px;
      text-align: center;
      vertical-align: bottom;
      border-right: 1px solid #e6edf2;
      padding: 0;
    }

    th.dest span {
      display: inline-block;
      transform: rotate(-45deg) translate(-8px, -4px);
      transform-origin: center;
      font-size: 0.73rem;
      color: #31494f;
      white-space: nowrap;
      font-weight: 600;
    }

    td {
      border-right: 1px solid #eaf0f4;
      border-bottom: 1px solid #eaf0f4;
      padding: 0;
      width: 48px;
      height: 34px;
      background: var(--cell-inactive);
    }

    tr:nth-child(even) td {
      background: #f2f7fb;
    }

    button.cell {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      position: relative;
    }

    button.cell::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #bfd0d8;
      background: #ffffff;
      position: absolute;
      inset: 0;
      margin: auto;
      transition: transform 120ms ease;
    }

    button.cell.active {
      background: var(--active-soft);
    }

    button.cell.active::before {
      background: var(--active);
      border-color: var(--active);
      box-shadow: 0 0 0 2px rgba(13, 108, 194, 0.18);
    }

    button.cell:hover::before,
    button.cell:focus-visible::before {
      transform: scale(1.2);
    }

    button.cell:focus-visible {
      outline: 2px solid #2e7fcf;
      outline-offset: -2px;
    }

    .status {
      border-top: 1px solid var(--line);
      padding: 13px 18px;
      font-size: 0.94rem;
      background: #f8fafc;
      min-height: 48px;
      display: flex;
      align-items: center;
      color: #263b41;
    }

    .empty {
      padding: 20px;
      color: #4e656d;
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 720px) {
      body {
        padding: 12px;
      }

      .topbar,
      .subbar,
      .status {
        padding-left: 12px;
        padding-right: 12px;
      }

      .matrix-wrap {
        padding: 10px;
      }

      th.corner {
        min-width: 92px;
        max-width: 92px;
      }

      th.dest,
      td {
        width: 42px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1 class="title">NEXX-XC1 Video Router</h1>
      <div class="meta">
        <span id="liveBadge" class="badge live">Live</span>
        <button id="refreshBtn" class="refresh-btn" type="button">Refresh</button>
      </div>
    </header>

    <div class="subbar">
      Last updated: <span id="lastUpdated">--</span>
    </div>

    <section class="matrix-wrap" aria-label="Video routing matrix">
      <div class="matrix-scroller" id="matrixScroller">
        <div class="empty" id="emptyState">Loading routes...</div>
      </div>
    </section>

    <footer class="status" id="statusText">Selected: none</footer>
  </main>

  <script>
    const API_URL = "/api/routes/video";
    const POLL_INTERVAL_MS = 5000;

    const refreshBtn = document.getElementById("refreshBtn");
    const liveBadge = document.getElementById("liveBadge");
    const lastUpdated = document.getElementById("lastUpdated");
    const matrixScroller = document.getElementById("matrixScroller");
    const statusText = document.getElementById("statusText");

    let activeRouteMap = new Map();
    let currentSources = [];
    let currentDestinations = [];

    function signalKey(port, id) {
      return `${port}:${id}`;
    }

    function signalLabel(item) {
      return `p${item.port} id${item.id}`;
    }

    function verboseSignal(item) {
      return `vid,port${item.port},id${item.id}`;
    }

    function markLiveState(isLive) {
      liveBadge.className = `badge ${isLive ? "live" : "stale"}`;
      liveBadge.textContent = isLive ? "Live" : "Stale";
    }

    function updateLastUpdated(text) {
      lastUpdated.textContent = text;
    }

    function getMatrixCellStatus(src, dst) {
      const key = signalKey(dst.port, dst.id);
      const activeSource = activeRouteMap.get(key);

      if (!activeSource) {
        return { active: false, activeSource: null };
      }

      return {
        active: activeSource.port === src.port && activeSource.id === src.id,
        activeSource,
      };
    }

    function setSelectedStatus(src, dst, isActive) {
      if (isActive) {
        statusText.textContent = `Selected: ${verboseSignal(dst)} <- ${verboseSignal(src)} (active)`;
      } else {
        statusText.textContent = `Selected: ${verboseSignal(src)} is not routed to this destination (${verboseSignal(dst)})`;
      }
    }

    function renderMatrix() {
      matrixScroller.innerHTML = "";

      if (!currentSources.length || !currentDestinations.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No video routes discovered in the current snapshot.";
        matrixScroller.appendChild(empty);
        return;
      }

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      const corner = document.createElement("th");
      corner.className = "corner";
      corner.textContent = "src -> dst";
      headerRow.appendChild(corner);

      currentDestinations.forEach((dst) => {
        const th = document.createElement("th");
        th.className = "dest";
        const span = document.createElement("span");
        span.textContent = signalLabel(dst);
        th.appendChild(span);
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      currentSources.forEach((src) => {
        const row = document.createElement("tr");

        const rowHead = document.createElement("th");
        rowHead.textContent = signalLabel(src);
        row.appendChild(rowHead);

        currentDestinations.forEach((dst) => {
          const td = document.createElement("td");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "cell";
          button.title = `${signalLabel(src)} -> ${signalLabel(dst)}`;

          const cellState = getMatrixCellStatus(src, dst);
          if (cellState.active) {
            button.classList.add("active");
          }

          button.addEventListener("click", () => {
            setSelectedStatus(src, dst, cellState.active);
          });

          td.appendChild(button);
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      matrixScroller.appendChild(table);
    }

    function normalizeSignals(data, key) {
      const signals = Array.isArray(data[key]) ? data[key] : [];
      return signals
        .filter((item) => Number.isInteger(item.port) && Number.isInteger(item.id))
        .sort((a, b) => (a.port - b.port) || (a.id - b.id));
    }

    function hydrateRouteMap(routes) {
      const map = new Map();
      routes.forEach((route) => {
        const valid = ["dst_port", "dst_id", "src_port", "src_id"].every((field) => Number.isInteger(route[field]));
        if (!valid) {
          return;
        }
        map.set(signalKey(route.dst_port, route.dst_id), { port: route.src_port, id: route.src_id });
      });
      activeRouteMap = map;
    }

    async function fetchRoutes() {
      refreshBtn.disabled = true;

      try {
        const response = await fetch(API_URL, { cache: "no-store" });
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || "Unknown error");
        }

        const routes = Array.isArray(payload.routes) ? payload.routes : [];
        currentSources = normalizeSignals(payload, "sources");
        currentDestinations = normalizeSignals(payload, "destinations");
        hydrateRouteMap(routes);
        renderMatrix();

        updateLastUpdated(payload.fetched_at || new Date().toISOString());
        markLiveState(true);
      } catch (error) {
        markLiveState(false);
        updateLastUpdated(`fetch failed (${new Date().toLocaleTimeString()})`);
        statusText.textContent = `Selected: data fetch error - ${error.message}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", () => {
      fetchRoutes();
    });

    fetchRoutes();
    setInterval(fetchRoutes, POLL_INTERVAL_MS);
  </script>
</body>
</html>
