<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexxroute Video Router</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1 class="title">NEXX-XC1 Video Router</h1>
      <div class="meta">
        <span id="liveBadge" class="badge live">Live</span>
        <button id="refreshBtn" class="refresh-btn" type="button">Refresh</button>
      </div>
    </header>

    <div class="subbar">
      Last updated: <span id="lastUpdated">--</span>
    </div>

    <section class="matrix-wrap" aria-label="Video routing matrix">
      <div class="matrix-scroller" id="matrixScroller">
        <div class="empty" id="emptyState">Loading routes...</div>
      </div>
    </section>

    <footer class="status" id="statusText">Selected: none</footer>
  </main>

  <script>
    const API_URL = "/api/routes/video";
    const POLL_INTERVAL_MS = 5000;

    const refreshBtn = document.getElementById("refreshBtn");
    const liveBadge = document.getElementById("liveBadge");
    const lastUpdated = document.getElementById("lastUpdated");
    const matrixScroller = document.getElementById("matrixScroller");
    const statusText = document.getElementById("statusText");

    let activeRouteMap = new Map();
    let currentSources = [];
    let currentDestinations = [];

    function signalKey(port, id) {
      return `${port}:${id}`;
    }

    function signalLabel(item) {
      return `p${item.port} id${item.id}`;
    }

    function verboseSignal(item) {
      return `vid,port${item.port},id${item.id}`;
    }

    function markLiveState(isLive) {
      liveBadge.className = `badge ${isLive ? "live" : "stale"}`;
      liveBadge.textContent = isLive ? "Live" : "Stale";
    }

    function updateLastUpdated(text) {
      lastUpdated.textContent = text;
    }

    function getMatrixCellStatus(src, dst) {
      const key = signalKey(dst.port, dst.id);
      const activeSource = activeRouteMap.get(key);

      if (!activeSource) {
        return { active: false, activeSource: null };
      }

      return {
        active: activeSource.port === src.port && activeSource.id === src.id,
        activeSource,
      };
    }

    function setSelectedStatus(src, dst, isActive) {
      if (isActive) {
        statusText.textContent = `Selected: ${verboseSignal(dst)} <- ${verboseSignal(src)} (active)`;
      } else {
        statusText.textContent = `Selected: ${verboseSignal(src)} is not routed to this destination (${verboseSignal(dst)})`;
      }
    }

    function renderMatrix() {
      matrixScroller.innerHTML = "";

      if (!currentSources.length || !currentDestinations.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No video routes discovered in the current snapshot.";
        matrixScroller.appendChild(empty);
        return;
      }

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      const corner = document.createElement("th");
      corner.className = "corner";
      corner.textContent = "src -> dst";
      headerRow.appendChild(corner);

      currentDestinations.forEach((dst) => {
        const th = document.createElement("th");
        th.className = "dest";
        const span = document.createElement("span");
        span.textContent = signalLabel(dst);
        th.appendChild(span);
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      currentSources.forEach((src) => {
        const row = document.createElement("tr");

        const rowHead = document.createElement("th");
        rowHead.textContent = signalLabel(src);
        row.appendChild(rowHead);

        currentDestinations.forEach((dst) => {
          const td = document.createElement("td");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "cell";
          button.title = `${signalLabel(src)} -> ${signalLabel(dst)}`;

          const cellState = getMatrixCellStatus(src, dst);
          if (cellState.active) {
            button.classList.add("active");
          }

          button.addEventListener("click", () => {
            setSelectedStatus(src, dst, cellState.active);
          });

          td.appendChild(button);
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      matrixScroller.appendChild(table);
    }

    function normalizeSignals(data, key) {
      const signals = Array.isArray(data[key]) ? data[key] : [];
      return signals
        .filter((item) => Number.isInteger(item.port) && Number.isInteger(item.id))
        .sort((a, b) => (a.port - b.port) || (a.id - b.id));
    }

    function hydrateRouteMap(routes) {
      const map = new Map();
      routes.forEach((route) => {
        const valid = ["dst_port", "dst_id", "src_port", "src_id"].every((field) => Number.isInteger(route[field]));
        if (!valid) {
          return;
        }
        map.set(signalKey(route.dst_port, route.dst_id), { port: route.src_port, id: route.src_id });
      });
      activeRouteMap = map;
    }

    async function fetchRoutes() {
      refreshBtn.disabled = true;

      try {
        const response = await fetch(API_URL, { cache: "no-store" });
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || "Unknown error");
        }

        const routes = Array.isArray(payload.routes) ? payload.routes : [];
        currentSources = normalizeSignals(payload, "sources");
        currentDestinations = normalizeSignals(payload, "destinations");
        hydrateRouteMap(routes);
        renderMatrix();

        updateLastUpdated(payload.fetched_at || new Date().toISOString());
        markLiveState(true);
      } catch (error) {
        markLiveState(false);
        updateLastUpdated(`fetch failed (${new Date().toLocaleTimeString()})`);
        statusText.textContent = `Selected: data fetch error - ${error.message}`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", () => {
      fetchRoutes();
    });

    fetchRoutes();
    setInterval(fetchRoutes, POLL_INTERVAL_MS);
  </script>
</body>
</html>
